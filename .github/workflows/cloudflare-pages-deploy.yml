name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnaitv-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run validate-schemas
      - run: |
          test -f .env.example
          grep -qx 'ENABLE_NTN_FEATURES=false' .env.example

  deploy-pages:
    name: Deploy gnaitv to Cloudflare Pages
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=gnaitv --branch=main