name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '33 12 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 30
          days-before-issue-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-label: no-issue-activity
          stale-pr-label: no-pr-activity
          stale-issue-message: 'This issue has been marked stale because it has been inactive for 30 days. Comment or update it within 7 days to keep it open.'
          stale-pr-message: 'This pull request has been marked stale because it has been inactive for 30 days. Comment or push an update within 7 days to keep it open.'
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
