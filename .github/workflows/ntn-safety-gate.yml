name: NTN Safety Gate

on:
  push:
    branches:
      - main
      - safety-gate/*
  pull_request:

jobs:
  safety-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Run deterministic test suite
        run: npm test -- --runInBand

      - name: Validate JSON Schemas
        run: npm run validate-schemas

      - name: Build safety artifact
        if: success()
        run: |
          echo "ENABLE_NTN_FEATURES=true" >> .env.production
          echo "Safety gate passed."

      - name: Lock features if tests fail
        if: failure()
        run: |
          echo "ENABLE_NTN_FEATURES=false" >> .env.production
          echo "Safety gate locked."
